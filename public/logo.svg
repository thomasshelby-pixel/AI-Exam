<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Royal Blue Gradients -->
    <linearGradient id="caBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0256cc" />
      <stop offset="100%" stop-color="#00358e" />
    </linearGradient>

    <linearGradient id="caDarkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b95" />
      <stop offset="100%" stop-color="#041d52" />
    </linearGradient>

    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0245a3" />
      <stop offset="50%" stop-color="#0a5cdb" />
      <stop offset="100%" stop-color="#0245a3" />
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <filter id="subtleDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <filter id="paperShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#022c6e" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Sparkle Stars at Top Right -->
  <g fill="#0284c7" opacity="0.95">
    <!-- Big sparkle -->
    <path d="M 395 72 C 395 88, 403 96, 419 96 C 403 96, 395 104, 395 120 C 395 104, 387 96, 371 96 C 387 96, 395 88, 395 72 Z" />
    <!-- Medium sparkle -->
    <path d="M 408 126 C 408 135, 413 140, 422 140 C 413 140, 408 145, 408 154 C 408 145, 403 140, 394 140 C 403 140, 408 135, 408 126 Z" />
    <!-- Tiny sparkle -->
    <path d="M 345 110 C 345 115, 348 118, 353 118 C 348 118, 345 121, 345 126 C 345 121, 342 118, 337 118 C 342 118, 345 115, 345 110 Z" />
  </g>

  <!-- Main Monogram CA -->
  <g filter="url(#subtleDrop)">
    <!-- Letter 'A' (Right Wing / Leg) -->
    <path d="M 285 85 L 360 85 L 410 270 L 350 270 L 332 205 L 290 205 L 280 240 C 265 242, 250 242, 235 240 Z" fill="url(#caDarkBlueGrad)" />
    <!-- Inner triangle counter of A -->
    <path d="M 324 165 L 311 122 L 298 165 Z" fill="#ffffff" />

    <!-- Letter 'C' (Outer Arc) -->
    <path d="M 270 78 C 215 65, 140 75, 95 120 C 45 170, 50 250, 105 295 C 160 338, 240 330, 285 305 L 265 272 C 230 290, 175 295, 132 265 C 92 230, 88 175, 125 138 C 160 102, 215 98, 258 108 Z" fill="url(#caBlueGrad)" />

    <!-- Inner 'C' thickness & accent bridge -->
    <path d="M 270 78 C 240 70, 180 75, 140 105 L 180 105 C 220 85, 255 82, 270 78 Z" fill="#38bdf8" />
  </g>

  <!-- Evaluated Answer Sheet Paper Document -->
  <g filter="url(#paperShadow)">
    <path d="M 152 135 C 175 128, 230 128, 268 152 C 285 163, 298 220, 278 260 C 245 270, 192 265, 170 245 C 150 226, 145 158, 152 135 Z" fill="url(#paperGrad)" stroke="#0284c7" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Answer Sheet Ruling Lines -->
    <line x1="205" y1="168" x2="262" y2="168" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="205" y1="195" x2="260" y2="195" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="205" y1="222" x2="248" y2="222" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Status Icons on Answer Paper -->
    <!-- 1. Green Circle with Checkmark -->
    <g transform="translate(182, 168)">
      <circle cx="0" cy="0" r="11" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" />
      <path d="M -4 0 L -1 3 L 4 -3" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 2. Orange Circle with Evaluation Warning / Partial Check -->
    <g transform="translate(182, 195)">
      <circle cx="0" cy="0" r="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5" />
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 1" />
    </g>

    <!-- 3. Red Circle with Cross -->
    <g transform="translate(182, 222)">
      <circle cx="0" cy="0" r="11" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" />
      <path d="M -3.5 -3.5 L 3.5 3.5 M 3.5 -3.5 L -3.5 3.5" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Orbital Examiner Swoosh Arc Under Document -->
  <path d="M 135 255 C 160 300, 240 310, 310 268 C 365 235, 415 190, 420 185 C 418 190, 370 248, 295 285 C 220 322, 145 295, 135 255 Z" fill="url(#swooshGrad)" />

  <!-- Examiner Fountain Pen / Stylus -->
  <g transform="rotate(-35, 330, 205)" filter="url(#subtleDrop)">
    <!-- Pen Barrel -->
    <rect x="315" y="105" width="22" height="95" rx="5" fill="#0f172a" />
    <!-- Pen Chrome Bands -->
    <rect x="315" y="135" width="22" height="4" fill="#38bdf8" />
    <rect x="315" y="175" width="22" height="5" fill="#e2e8f0" />
    <rect x="315" y="105" width="22" height="15" rx="3" fill="#0284c7" />
    <!-- Pen Grip & Nib -->
    <polygon points="317,200 335,200 330,225 322,225" fill="#1e293b" />
    <polygon points="320,225 332,225 326,242" fill="#0284c7" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Nib slit -->
    <line x1="326" y1="225" x2="326" y2="238" stroke="#0f172a" stroke-width="1" />
  </g>

  <!-- Typography: CA EXAM CHECKER AI -->
  <g text-anchor="middle">
    <text x="250" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#091836">
      CA EXAM CHECKER <tspan fill="#0284c7">AI</tspan>
    </text>

    <!-- Tagline: - CHECKED LIKE AN EXAMINER - -->
    <g transform="translate(250, 410)">
      <!-- Left line -->
      <line x1="-210" y1="-5" x2="-145" y2="-5" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
      <!-- Text -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14.5" letter-spacing="3.5" fill="#334155">
        CHECKED LIKE AN EXAMINER
      </text>
      <!-- Right line -->
      <line x1="145" y1="-5" x2="210" y2="-5" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Bottom Blue Badge Pill: ACCURATE • RELIABLE • EXAMINER STYLE EVALUATION -->
    <g transform="translate(250, 442)">
      <rect x="-215" y="-16" width="430" height="32" rx="16" fill="url(#pillGrad)" filter="url(#subtleDrop)" />
      <!-- Subtle internal stroke highlight -->
      <rect x="-214" y="-15" width="428" height="30" rx="15" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" letter-spacing="1.2" fill="#ffffff">
        <tspan fill="#60a5fa">•</tspan> ACCURATE  <tspan fill="#60a5fa">•</tspan> RELIABLE  <tspan fill="#60a5fa">•</tspan> EXAMINER STYLE EVALUATION
      </text>
    </g>
  </g>
</svg>
