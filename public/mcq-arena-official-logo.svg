<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="navyRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- White Letter Gloss -->
    <linearGradient id="letterGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <!-- Page Gradient -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <!-- Drop Shadow Filters -->
    <filter id="shadowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowEmblem" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- LEFT EMBLEM: CIRCULAR ACADEMIC EMBLEM (x: 10 to 140, y: 10 to 150) -->
  <!-- ============================================== -->
  <g transform="translate(10, 10)">
    <!-- Outer Golden Crest Rings -->
    <circle cx="70" cy="70" r="66" fill="url(#navyRing)" stroke="url(#goldStroke)" stroke-width="3" filter="url(#glowEmblem)" />
    <circle cx="70" cy="70" r="61" fill="none" stroke="url(#goldStroke)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75" />
    <circle cx="70" cy="70" r="57" fill="url(#darkBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Subtle Radiant Burst behind Emblem -->
    <circle cx="70" cy="70" r="46" fill="none" stroke="url(#goldSheen)" stroke-width="0.5" opacity="0.3" />

    <!-- 1. OPEN ACADEMIC BOOK -->
    <!-- Book Base / Cover -->
    <path d="M 32 94 C 48 97 64 96 70 99 C 76 96 92 97 108 94 C 110 97 108 103 106 104 C 92 107 76 106 70 108 C 64 106 48 107 34 104 C 32 103 30 97 32 94 Z" fill="url(#goldStroke)" filter="url(#shadowDepth)" />

    <!-- Left Pages (Curved Stack) -->
    <path d="M 33 91 C 48 94 63 93 70 97 L 70 78 C 63 74 48 75 33 72 Z" fill="url(#pageGradLeft)" stroke="url(#goldStroke)" stroke-width="0.8" />
    <path d="M 35 88 C 49 91 63 90 70 94 L 70 75 C 63 71 49 72 35 69 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 37 85 C 50 88 63 87 70 91 L 70 72 C 63 68 50 69 37 66 Z" fill="url(#pageGradLeft)" stroke="#cbd5e1" stroke-width="0.5" />

    <!-- Right Pages (Curved Stack) -->
    <path d="M 107 91 C 92 94 77 93 70 97 L 70 78 C 77 74 92 75 107 72 Z" fill="url(#pageGradRight)" stroke="url(#goldStroke)" stroke-width="0.8" />
    <path d="M 105 88 C 91 91 77 90 70 94 L 70 75 C 77 71 91 72 105 69 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 103 85 C 90 88 77 87 70 91 L 70 72 C 77 68 90 69 103 66 Z" fill="url(#pageGradRight)" stroke="#cbd5e1" stroke-width="0.5" />

    <!-- Book Spine Gilded Line -->
    <path d="M 70 71 L 70 98" stroke="url(#goldLight)" stroke-width="1.8" stroke-linecap="round" />

    <!-- 2. GOLDEN FOUNTAIN PEN NIB (Rising from spine) -->
    <g transform="translate(0, -6)" filter="url(#shadowGold)">
      <!-- Nib Body -->
      <path d="M 70 42 L 77 67 C 77 69 75 73 70 74 C 65 73 63 69 63 67 Z" fill="url(#goldSheen)" stroke="url(#goldStroke)" stroke-width="1" />
      <!-- Nib Breather Hole -->
      <circle cx="70" cy="58" r="2.2" fill="#090d16" stroke="url(#goldLight)" stroke-width="0.6" />
      <!-- Nib Slit -->
      <path d="M 70 42 L 70 56" stroke="#090d16" stroke-width="1.2" stroke-linecap="round" />
      <!-- Nib Left & Right Gilded Filigree Highlights -->
      <path d="M 66 64 C 67 60 68 53 70 45" stroke="url(#goldLight)" stroke-width="0.8" fill="none" opacity="0.8" />
      <path d="M 74 64 C 73 60 72 53 70 45" stroke="url(#goldLight)" stroke-width="0.8" fill="none" opacity="0.8" />
    </g>

    <!-- 3. GRADUATION CAP (MORTARBOARD) -->
    <g transform="translate(0, 0)">
      <!-- Skull cap beneath mortarboard -->
      <path d="M 58 40 C 58 46 82 46 82 40 Z" fill="#1e293b" stroke="url(#goldStroke)" stroke-width="0.8" />
      <!-- Mortarboard Diamond Top -->
      <polygon points="70,22 101,33 70,44 39,33" fill="#090d16" stroke="url(#goldStroke)" stroke-width="1.8" filter="url(#shadowDepth)" />
      <!-- Cap Center Button -->
      <circle cx="70" cy="33" r="2.8" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="0.8" />
      <!-- Golden Tassel Cord & Tassel dangling to right -->
      <path d="M 70 33 C 78 33 87 37 92 46 C 93 48 94 54 94 58" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-linecap="round" />
      <!-- Tassel Bell / Fringe -->
      <polygon points="92,58 96,58 97,67 91,67" fill="url(#goldSheen)" stroke="url(#goldStroke)" stroke-width="0.7" />
      <line x1="94" y1="67" x2="94" y2="70" stroke="url(#goldLight)" stroke-width="1" />
    </g>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT TYPOGRAPHY: "MCQ" + "ARENA" (x: 165 to 500) -->
  <!-- ============================================== -->
  <g transform="translate(165, 0)">
    <!-- 1. "M" -->
    <g filter="url(#shadowDepth)">
      <!-- Outer 3D Gold Extrusion -->
      <path d="M 5 102 L 5 28 L 27 28 L 47 70 L 67 28 L 89 28 L 89 102 L 72 102 L 72 52 L 54 90 L 40 90 L 22 52 L 22 102 Z"
            fill="url(#goldSheen)" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Front White Specular Face -->
      <path d="M 7 100 L 7 30 L 26 30 L 47 74 L 68 30 L 87 30 L 87 100 L 73 100 L 73 54 L 53 93 L 41 93 L 21 54 L 21 100 Z"
            fill="url(#letterGloss)" />
      <!-- Top Bevel Highlight -->
      <path d="M 7 30 L 26 30 L 47 72 L 47 76 L 25 32 L 7 32 Z" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- 2. "C" -->
    <g transform="translate(98, 0)" filter="url(#shadowDepth)">
      <!-- Outer 3D Gold Extrusion -->
      <path d="M 80 43 C 74 32 64 27 49 27 C 27 27 10 44 10 65 C 10 86 27 103 49 103 C 65 103 75 97 81 87 L 66 77 C 62 83 56 87 48 87 C 36 87 27 77 27 65 C 27 53 36 43 48 43 C 56 43 62 47 66 53 Z"
            fill="url(#goldSheen)" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Front White Specular Face -->
      <path d="M 79 44 C 73 34 63 29 49 29 C 28 29 12 45 12 65 C 12 85 28 101 49 101 C 64 101 74 95 79 86 L 66 77 C 62 82 56 85 48 85 C 37 85 29 76 29 65 C 29 54 37 45 48 45 C 56 45 62 48 66 53 Z"
            fill="url(#letterGloss)" />
      <!-- Upper Curve Glint -->
      <path d="M 49 29 C 63 29 73 34 79 44 L 75 46 C 70 37 61 31 49 31 C 36 31 25 38 20 48 L 17 46 C 23 35 35 29 49 29 Z" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- 3. "Q" WITH INTEGRATED DARK SPHERE & DYNAMIC GOLD CHECKMARK -->
    <g transform="translate(186, 0)" filter="url(#shadowDepth)">
      <!-- Q Outer Oval Body (Gold Rim) -->
      <path d="M 50 27 C 26 27 8 44 8 65 C 8 83 23 98 44 102 L 40 106 L 56 106 L 61 101 C 78 96 92 82 92 65 C 92 44 74 27 50 27 Z"
            fill="url(#goldSheen)" stroke="url(#goldStroke)" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Q Front White Specular Ring -->
      <path d="M 50 29 C 28 29 11 45 11 65 C 11 82 25 96 45 100 L 42 104 L 54 104 L 59 99 C 76 95 89 81 89 65 C 89 45 72 29 50 29 Z"
            fill="url(#letterGloss)" />

      <!-- Dark Metallic Sphere / Inner Aperture -->
      <ellipse cx="50" cy="65" rx="25" ry="25" fill="#080d1a" stroke="url(#navyRing)" stroke-width="1.5" />
      <ellipse cx="50" cy="65" rx="23" ry="23" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />

      <!-- Q Tail Accent Tab -->
      <polygon points="62,88 88,112 76,112 55,93" fill="url(#goldSheen)" stroke="url(#goldStroke)" stroke-width="1" />

      <!-- THE OFFICIAL 3D GOLD CHECKMARK (Slashing dynamically through Q) -->
      <g filter="url(#shadowGold)">
        <!-- Gold Checkmark Back Shadow / Thickness -->
        <path d="M 33 65 L 47 79 L 85 41 L 89 45 L 47 87 L 29 69 Z" fill="#b45309" />
        <!-- Gold Checkmark Front Face -->
        <path d="M 33 63 L 47 77 L 85 38 L 91 43 L 47 85 L 29 67 Z" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" />
        <!-- Checkmark High-Gloss Specular Ridge -->
        <line x1="33" y1="63" x2="47" y2="77" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />
        <line x1="47" y1="77" x2="85" y2="38" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
      </g>
    </g>

    <!-- 4. "ARENA" (Directly underneath "MCQ") -->
    <g transform="translate(8, 126)">
      <!-- Spaced Uppercase Letters "A   R   E   N   A" with Gold Border and White Gloss -->
      <text x="136" y="0"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
            font-weight="900"
            font-size="22"
            letter-spacing="9"
            fill="#ffffff"
            stroke="url(#goldStroke)"
            stroke-width="1"
            filter="url(#shadowDepth)">
        ARENA
      </text>

      <!-- Decorative Gold Underline Accent Wings -->
      <line x1="12" y1="12" x2="95" y2="12" stroke="url(#goldSheen)" stroke-width="1.5" stroke-linecap="round" />
      <polygon points="100,12 95,9 95,15" fill="url(#goldLight)" />
      <circle cx="136" cy="12" r="2.5" fill="url(#goldLight)" stroke="url(#goldStroke)" stroke-width="0.8" />
      <polygon points="172,12 177,9 177,15" fill="url(#goldLight)" />
      <line x1="177" y1="12" x2="260" y2="12" stroke="url(#goldSheen)" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
