name: Protected production invariants

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  protected-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Protected persistence regression tests
        run: npm run test:protected

      - name: Existing protected-system regression suites
        run: npm run test:protected:ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
