name: Institute account persistence validation

on:
  pull_request:
    paths:
      - 'server/routes/authRoutes.ts'
      - 'server/routes/instituteRoutes.ts'
      - 'server/services/firestoreSyncService.ts'
      - 'server/services/instituteAccountPersistenceService.ts'
      - 'server/tests/instituteAccountCloudPersistence.test.ts'
      - '.github/workflows/institute-account-validation.yml'

permissions:
  contents: read

jobs:
  institute-account-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Institute account persistence and deployment recovery regression
        run: node_modules/.bin/tsx server/tests/instituteAccountCloudPersistence.test.ts

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
