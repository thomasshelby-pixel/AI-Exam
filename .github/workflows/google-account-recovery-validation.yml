name: Google account recovery validation

on:
  pull_request:
    paths:
      - "server/services/googleAccountRecoveryService.ts"
      - "server/services/firestoreSyncService.ts"
      - "server/routes/adminRoutes.ts"
      - "server/tests/googleAccountRecoveryClassification.test.ts"
      - "src/components/admin/GoogleAccountRecoverySection.tsx"
      - "src/pages/admin/AdminPortal.tsx"
      - "package.json"
      - "package-lock.json"
      - "bun.lock"
      - ".github/workflows/google-account-recovery-validation.yml"

permissions:
  contents: read

jobs:
  google-account-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Google account recovery classification safety regression
        run: node_modules/.bin/tsx server/tests/googleAccountRecoveryClassification.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
