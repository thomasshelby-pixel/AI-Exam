name: Production Uptime Monitor

on:
  schedule:
    # GitHub schedules are best-effort and can be delayed.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime-monitor
  cancel-in-progress: false

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public homepage and lightweight health endpoint
        id: probe
        shell: bash
        run: |
          set +e
          homepage_code="$(curl --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 --output /dev/null --write-out '%{http_code}' https://caexamcheckerai.com)"
          homepage_rc=$?
          health_code="$(curl --silent --show-error --location --max-time 20 --retry 2 --retry-delay 2 --output /dev/null --write-out '%{http_code}' https://caexamcheckerai.com/healthz)"
          health_rc=$?
          echo "homepage_code=$homepage_code" >> "$GITHUB_OUTPUT"
          echo "homepage_rc=$homepage_rc" >> "$GITHUB_OUTPUT"
          echo "health_code=$health_code" >> "$GITHUB_OUTPUT"
          echo "health_rc=$health_rc" >> "$GITHUB_OUTPUT"
          if [ "$homepage_rc" -ne 0 ] || [ "$homepage_code" -lt 200 ] || [ "$homepage_code" -ge 400 ] || [ "$health_rc" -ne 0 ] || [ "$health_code" -lt 200 ] || [ "$health_code" -ge 300 ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "healthy=true" >> "$GITHUB_OUTPUT"

      - name: Open or update incident issue on failure
        if: failure() && steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Uptime Alert] CA Exam Checker AI production health check failed';
            const homepage = '${{ steps.probe.outputs.homepage_code }}';
            const health = '${{ steps.probe.outputs.health_code }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            const details = [
              'The scheduled production probe could not confirm both public endpoints are healthy.',
              '',
              '- Homepage HTTP status: ' + (homepage || 'no response'),
              '- /healthz HTTP status: ' + (health || 'no response'),
              '- Workflow run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId,
              '',
              'This monitor does not restart, redeploy, roll back, or modify production data. Investigate logs and deployment status before taking corrective action.'
            ].join('\\n');
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: details });
            } else {
              await github.rest.issues.create({ owner, repo, title, body: details });
            }

      - name: Close incident issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Uptime Alert] CA Exam Checker AI production health check failed';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            for (const issue of open.filter(i => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'Both production probes recovered in this scheduled run. Verify service logs if an incident occurred.'
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
