# Firebase App Hosting Configuration
# Controls Cloud Run runtime settings for production deployments
runConfig:
  minInstances: 0
  # The app runs a durable in-process evaluation worker. Keep enough headroom for
  # small-scale concurrency while bounding duplicate startup hydration and idle CPU cost.
  maxInstances: 3
  concurrency: 80
  cpu: 1
  # Match the request-based CPU billing setting selected in Cloud Run.
  # Note: the current evaluation worker still runs in-process after the HTTP response;
  # migrate it to a request-bound worker (for example Cloud Tasks) to avoid CPU throttling.
  cpuAlwaysAllocated: false
  memoryMiB: 1024

scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: SMTP_HOST
    value: smtp.resend.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: resend
    availability:
      - RUNTIME
  - variable: SMTP_FROM
    value: "CA Exam Checker AI <support@caexamcheckerai.com>"
    availability:
      - RUNTIME
  - variable: APP_URL
    value: https://caexamcheckerai.com
    availability:
      - RUNTIME
  # Temporary account-scoped MFA exception for the institute test account only.
  # The backend additionally requires role=INSTITUTE_ADMIN and status=ACTIVE.
  - variable: ENABLE_TEST_ACCOUNT_MFA_BYPASS
    value: "true"
    availability:
      - RUNTIME
  - variable: MFA_TEST_BYPASS_EMAIL
    value: test@gmail.com
    availability:
      - RUNTIME
