# Firebase App Hosting Configuration
# Controls Cloud Run runtime settings for production deployments
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: npm run apphosting:build
  runCommand: node dist/server.cjs

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUN
  - variable: PORT
    value: "8080"
    availability:
      - RUN
  - variable: SMTP_HOST
    value: smtp.resend.com
  - variable: SMTP_PORT
    value: "465"
  - variable: SMTP_USER
    value: resend
  - variable: SMTP_FROM
    value: "CA Exam Checker AI <support@caexamcheckerai.com>"
  - variable: APP_URL
    value: https://caexamcheckerai.com
