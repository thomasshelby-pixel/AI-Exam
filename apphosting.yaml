# Firebase App Hosting Configuration
# Controls Cloud Run runtime settings for production deployments
runConfig:
  minInstances: 0
  # Request-bound Cloud Tasks workers; cap concurrent instances to bound cold-start hydration.
  maxInstances: 3
  concurrency: 80
  cpu: 1
  # Request-based CPU: evaluation work is executed inside authenticated Cloud Tasks HTTP requests.
  cpuAlwaysAllocated: false
  memoryMiB: 1024

scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: SMTP_HOST
    value: smtp.resend.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: resend
    availability:
      - RUNTIME
  - variable: SMTP_FROM
    value: "CA Exam Checker AI <support@caexamcheckerai.com>"
    availability:
      - RUNTIME
  - variable: APP_URL
    value: https://caexamcheckerai.com
    availability:
      - RUNTIME
  # Temporary account-scoped MFA exception for the institute test account only.
  # The backend additionally requires role=INSTITUTE_ADMIN and status=ACTIVE.
  - variable: ENABLE_TEST_ACCOUNT_MFA_BYPASS
    value: "true"
    availability:
      - RUNTIME
  - variable: MFA_TEST_BYPASS_EMAIL
    value: test@gmail.com
    availability:
      - RUNTIME
