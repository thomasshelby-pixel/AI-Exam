<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CA Exam Checker AI</title>
    <meta name="description" content="Professional AI-powered examination evaluation platform for CA Foundation, Intermediate, and Final answer sheets with step marking, standards audit compliance, and institute management." />
    <meta property="og:title" content="CA Exam Checker AI" />
    <meta property="og:description" content="Professional AI-powered examination evaluation platform for CA Foundation, Intermediate, and Final answer sheets with step marking, standards audit compliance, and institute management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        try {
          var root = document.documentElement;
          if (!root) return;
          var saved = localStorage.getItem('ca_exam_checker_theme') || localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            root.classList.add('dark');
            if (root.style) root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            if (root.style) root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
